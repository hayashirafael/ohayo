name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      OHAYO_CODESIGN_IDENTITY: ${{ secrets.OHAYO_CODESIGN_IDENTITY }}
      OHAYO_UNIVERSAL_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate distribution credential configuration
        id: credentials
        env:
          OHAYO_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.OHAYO_CODESIGN_CERTIFICATE_BASE64 }}
          OHAYO_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.OHAYO_CODESIGN_CERTIFICATE_PASSWORD }}
          OHAYO_NOTARY_APPLE_ID: ${{ secrets.OHAYO_NOTARY_APPLE_ID }}
          OHAYO_NOTARY_TEAM_ID: ${{ secrets.OHAYO_NOTARY_TEAM_ID }}
          OHAYO_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.OHAYO_NOTARY_APP_SPECIFIC_PASSWORD }}
          OHAYO_SPARKLE_PRIVATE_KEY: ${{ secrets.OHAYO_SPARKLE_PRIVATE_KEY }}
        run: ./scripts/configure-release-mode.sh
      - name: Validate packaging scripts and workflows
        run: |
          bash -n \
            scripts/configure-release-mode.sh \
            scripts/make-app.sh \
            scripts/make-dmg.sh \
            scripts/test-release-mode.sh \
            scripts/update-cask.sh
          ./scripts/test-release-mode.sh
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/ci.yml .github/workflows/release.yml
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v${plist_version}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME não corresponde ao Info.plist v${plist_version}" >&2
            exit 1
          fi
      - run: swift test
      - run: brew install create-dmg
      - name: Import Developer ID certificate
        if: steps.credentials.outputs.signing_enabled == 'true'
        env:
          OHAYO_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.OHAYO_CODESIGN_CERTIFICATE_BASE64 }}
          OHAYO_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.OHAYO_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/ohayo-developer-id.p12"
          keychain_path="$RUNNER_TEMP/ohayo-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$OHAYO_CODESIGN_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$OHAYO_CODESIGN_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          if [[ "$identities" != *'"Developer ID Application:'* ]]; then
            echo "::error::O certificado importado não é Developer ID Application" >&2
            exit 1
          fi
          if [[ "$identities" != *"$OHAYO_CODESIGN_IDENTITY"* ]]; then
            echo "::error::OHAYO_CODESIGN_IDENTITY não corresponde ao certificado importado" >&2
            exit 1
          fi
          rm -f "$certificate_path"

          echo "OHAYO_CODESIGN_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "OHAYO_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - run: ./scripts/make-dmg.sh
      - name: Verify packaged app and disk image
        run: |
          set -euo pipefail
          dmg_files=(build/Ohayo-*.dmg)
          [[ "${#dmg_files[@]}" -eq 1 ]] || {
            echo "::error::Esperado exatamente um DMG, encontrados ${#dmg_files[@]}" >&2
            exit 1
          }

          codesign --verify --deep --strict --verbose=2 build/Ohayo.app
          codesign --verify --deep --strict --verbose=2 \
            build/Ohayo.app/Contents/Frameworks/Sparkle.framework
          lipo build/Ohayo.app/Contents/MacOS/Ohayo \
            -verify_arch arm64 x86_64
          lipo \
            build/Ohayo.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle \
            -verify_arch arm64 x86_64
          otool -l build/Ohayo.app/Contents/MacOS/Ohayo \
            | grep -q '@executable_path/../Frameworks'
          minos_count="$(vtool -show-build build/Ohayo.app/Contents/MacOS/Ohayo \
            | awk '$1 == "minos" && $2 == "13.0" { count++ } END { print count + 0 }')"
          [[ "$minos_count" -eq 2 ]] || {
            echo "::error::As duas arquiteturas devem manter deployment target macOS 13.0" >&2
            exit 1
          }
          codesign --display --entitlements - build/Ohayo.app 2>&1 \
            | grep -q 'com.apple.security.automation.apple-events'
          plutil -lint build/Ohayo.app/Contents/Info.plist
          plutil -lint scripts/Ohayo.entitlements
          hdiutil verify "${dmg_files[0]}"

          if [[ "${{ steps.credentials.outputs.signing_enabled }}" == "true" ]]; then
            codesign --display --verbose=4 build/Ohayo.app 2>&1 | grep -q 'runtime'
            codesign --verify --strict --verbose=2 "${dmg_files[0]}"
          else
            codesign --display --verbose=4 build/Ohayo.app 2>&1 \
              | grep -q 'Signature=adhoc'
          fi
      - name: Configure notarization credentials
        if: steps.credentials.outputs.notarization_enabled == 'true'
        env:
          OHAYO_NOTARY_APPLE_ID: ${{ secrets.OHAYO_NOTARY_APPLE_ID }}
          OHAYO_NOTARY_TEAM_ID: ${{ secrets.OHAYO_NOTARY_TEAM_ID }}
          OHAYO_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.OHAYO_NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "ohayo-release" \
            --keychain "$OHAYO_SIGNING_KEYCHAIN" \
            --apple-id "$OHAYO_NOTARY_APPLE_ID" \
            --team-id "$OHAYO_NOTARY_TEAM_ID" \
            --password "$OHAYO_NOTARY_APP_SPECIFIC_PASSWORD" \
            --validate
      - name: Notarize, staple and validate distributed app
        if: steps.credentials.outputs.notarization_enabled == 'true'
        run: |
          set -euo pipefail
          dmg_files=(build/Ohayo-*.dmg)
          [[ "${#dmg_files[@]}" -eq 1 ]]
          result_path="$RUNNER_TEMP/ohayo-notarization-result.json"
          mount_point="$RUNNER_TEMP/ohayo-notarized-mount"
          smoke_log="$RUNNER_TEMP/ohayo-smoke.log"
          mounted=false
          smoke_pid=""

          cleanup() {
            if [[ -n "$smoke_pid" ]] && kill -0 "$smoke_pid" 2>/dev/null; then
              kill "$smoke_pid" 2>/dev/null || true
              wait "$smoke_pid" 2>/dev/null || true
            fi
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          xcrun notarytool submit "${dmg_files[0]}" \
            --keychain-profile "ohayo-release" \
            --keychain "$OHAYO_SIGNING_KEYCHAIN" \
            --wait \
            --timeout 60m \
            --output-format json > "$result_path"

          status="$(plutil -extract status raw -o - "$result_path")"
          if [[ "$status" != "Accepted" ]]; then
            echo "::error::Apple Notary Service retornou status $status" >&2
            exit 1
          fi

          xcrun stapler staple "${dmg_files[0]}"
          xcrun stapler validate "${dmg_files[0]}"
          hdiutil verify "${dmg_files[0]}"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "${dmg_files[0]}"

          rm -rf "$mount_point"
          mkdir -p "$mount_point"
          hdiutil attach "${dmg_files[0]}" \
            -readonly \
            -nobrowse \
            -mountpoint "$mount_point"
          mounted=true

          distributed_app="$mount_point/Ohayo.app"
          test -x "$distributed_app/Contents/MacOS/Ohayo"
          codesign --verify --deep --strict --verbose=2 "$distributed_app"
          spctl --assess --type execute --verbose=4 "$distributed_app"

          "$distributed_app/Contents/MacOS/Ohayo" >"$smoke_log" 2>&1 &
          smoke_pid=$!
          sleep 3
          if ! kill -0 "$smoke_pid" 2>/dev/null; then
            wait "$smoke_pid" || smoke_status=$?
            cat "$smoke_log"
            echo "::error::Ohayo encerrou durante o smoke (status ${smoke_status:-0})" >&2
            exit 1
          fi
          kill "$smoke_pid"
          wait "$smoke_pid" 2>/dev/null || true
          smoke_pid=""
          hdiutil detach "$mount_point"
          mounted=false
      - name: Generate and verify signed Sparkle appcast
        env:
          OHAYO_SPARKLE_PRIVATE_KEY: ${{ secrets.OHAYO_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          appcast_dir="$RUNNER_TEMP/ohayo-appcast"
          mkdir -p "$appcast_dir"
          cp "build/Ohayo-${version}.dmg" "$appcast_dir/"

          printf '%s' "$OHAYO_SPARKLE_PRIVATE_KEY" \
            | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
                --ed-key-file - \
                --download-url-prefix \
                "https://github.com/hayashirafael/ohayo/releases/download/${GITHUB_REF_NAME}/" \
                --link "https://github.com/hayashirafael/ohayo" \
                --maximum-versions 1 \
                --maximum-deltas 0 \
                -o "$GITHUB_WORKSPACE/build/appcast.xml" \
                "$appcast_dir"

          xmllint --noout build/appcast.xml
          grep -q 'sparkle:edSignature=' build/appcast.xml
          grep -q '<!-- sparkle-signatures:' build/appcast.xml
          grep -q "Ohayo-${version}.dmg" build/appcast.xml
      - name: Remove signing material
        if: always() && steps.credentials.outputs.signing_enabled == 'true'
        run: |
          if [[ -n "${OHAYO_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$OHAYO_SIGNING_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP/ohayo-developer-id.p12" \
            "$RUNNER_TEMP/ohayo-notarization-result.json"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Ohayo-*.dmg
            build/appcast.xml
      - uses: actions/checkout@v4
        with:
          repository: hayashirafael/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update Homebrew cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/update-cask.sh "$VERSION" "build/Ohayo-${VERSION}.dmg" "homebrew-tap/Casks"
      - name: Commit Homebrew cask
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ohayo.rb
          if git diff --cached --quiet; then
            echo "No cask changes"
          else
            git commit -m "Update Ohayo cask to ${GITHUB_REF_NAME}"
            git push
          fi
